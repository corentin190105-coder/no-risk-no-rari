<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="No Risk No Rari">
<meta name="robots" content="noindex">
<title>Point du soir · No Risk No Rari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
html, body { margin: 0; }
.title.small { font-size: clamp(40px, 7vw, 78px); }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days button { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--fg-2); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.days button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.days button:focus-visible { outline: 2px solid var(--fg-2); outline-offset: 2px; }
.hero-card { border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--mood) 45%, var(--line)); background: linear-gradient(150deg, color-mix(in srgb, var(--mood) 26%, var(--surface-2)) 0%, var(--surface) 70%); padding: 22px; display: grid; gap: 10px; }
.hero-card .when { font-family: var(--font-data); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); }
.hero-card h2 { font-size: clamp(30px, 5vw, 46px); text-wrap: balance; }
.hero-card h2::before { display: none; }
.hero-card p { margin: 0; color: var(--fg-2); max-width: 70ch; font-size: 16px; }
.mood { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; background: color-mix(in srgb, var(--mood) 30%, transparent); color: var(--fg); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: linear-gradient(165deg, color-mix(in srgb, var(--c) 16%, var(--surface)) 0%, var(--surface) 55%); padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card.full { grid-column: 1 / -1; }
.card h3 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; }
.card h3::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.card p { margin: 0; color: var(--fg-2); max-width: 70ch; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.items li { display: grid; gap: 2px; }
.items strong { color: var(--fg); font-size: 14.5px; }
.items span { color: var(--fg-2); font-size: 14px; }
.idea-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.idea-head .nm { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; }
.term { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; }
.src { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.src a { color: var(--fg-2); }
@media (max-width: 900px) { .cards { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topline">
      <span class="eyebrow">Point du soir · Marchés et portefeuille</span>
      <span class="status"><span class="dot" id="dot"></span><span id="stat">Chargement…</span></span>
    </div>
    <h1 class="title small"><span>No risk</span><span class="red">No rari</span></h1>
    <div class="checker" aria-hidden="true"></div>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">Tableau de bord</a>
      <a class="nav-point" href="point.html" aria-current="page">Point du soir</a>
    </nav>
  </header>

  <section style="--sec: var(--s7)" aria-labelledby="h-arch">
    <div class="sec-head"><h2 id="h-arch">Le point du soir</h2><div class="days" id="days" role="group" aria-label="Choisir un jour"></div></div>
    <div id="content"></div>
  </section>

  <footer class="foot">
    <span>Rédigé chaque soir vers 21h par Claude à partir de l'actualité du jour. Ce n'est pas un conseil en investissement.</span>
  </footer>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
  const pct = (x) => (x >= 0 ? "+" : "") + Number(x).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " %";
  const fmt = (d, o) => { const t = new Date(String(d).slice(0, 10) + "T12:00:00"); return isNaN(t) ? esc(d) : t.toLocaleDateString("fr-FR", o); };
  const RISK = { "Modéré": "--r2", "Élevé": "--r3", "Très élevé": "--r4", "Socle": "--r1" };
  let points = [], idx = 0;

  function tiles(list) {
    const g = css("--good"), b = css("--bad"), sf = css("--surface");
    return `<div class="heat">${list.map((i) => {
      const v = Number(i.variation) || 0, k = Math.min(Math.abs(v) / 2, 1), c = v >= 0 ? g : b;
      return `<div class="tile" style="background:color-mix(in srgb, ${c} ${Math.round(12 + k * 55)}%, ${sf});border-color:color-mix(in srgb, ${c} 45%, transparent)">
        <span class="tn">${esc(i.nom)}</span><span class="tv">${pct(v)}</span><span class="tp">${esc(i.valeur ?? "")}</span></div>`;
    }).join("")}</div>`;
  }

  function render() {
    const el = $("content");
    if (!points.length) {
      el.innerHTML = `<div class="empty"><strong>Ton premier point arrive ce soir vers 21h</strong>Chaque soir, Claude publie ici le résumé des marchés, la macro, l'actualité de tes actifs, une idée à surveiller et le concept du jour.</div>`;
      $("days").innerHTML = ""; return;
    }
    $("days").innerHTML = points.slice(0, 14).map((p, i) => `<button type="button" data-i="${i}" aria-pressed="${i === idx}">${i === 0 ? "Ce soir" : fmt(p.date, { weekday: "short", day: "numeric", month: "short" })}</button>`).join("");
    const p = points[idx];
    const moodVar = p.humeur === "hausse" ? "--good" : p.humeur === "baisse" ? "--bad" : "--s4";
    const moodTxt = p.humeur === "hausse" ? "Marchés en hausse" : p.humeur === "baisse" ? "Marchés en baisse" : "Marchés partagés";
    const pf = p.portefeuille || {};
    const ideas = Array.isArray(p.idees) && p.idees.length ? p.idees : (p.idee ? [p.idee] : []);
    el.innerHTML = `
      <div class="hero-card" style="--mood: var(${moodVar})">
        <span class="when">${fmt(p.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</span>
        <span class="mood">${moodTxt}</span>
        <h2>${esc(p.titre)}</h2>
        ${p.resume ? `<p>${esc(p.resume)}</p>` : ""}
      </div>
      ${(p.indices || []).length ? `<div class="panel" style="margin-top:12px"><h3>Les marchés du jour</h3>${tiles(p.indices)}</div>` : ""}
      <div class="cards" style="margin-top:12px">
        ${(p.macro || []).length ? `<div class="card" style="--c: var(--s1)"><h3>Macroéconomie</h3><ul class="items">${p.macro.map((m) => `<li><strong>${esc(m.titre)}</strong><span>${esc(m.texte)}</span></li>`).join("")}</ul></div>` : ""}
        <div class="card" style="--c: var(${(Number(pf.pv) || 0) >= 0 ? "--good" : "--bad"})"><h3>Mon portefeuille</h3>
          ${typeof pf.valeur === "number" ? `<div class="idea-head"><span class="nm">${eur.format(pf.valeur)}</span>${typeof pf.pv === "number" ? `<span class="${pf.pv >= 0 ? "up" : "down"}" style="font-family:var(--font-data)">${pf.pv >= 0 ? "+" : "−"}${eur.format(Math.abs(pf.pv))}</span>` : ""}</div>` : ""}
          ${pf.texte ? `<p>${esc(pf.texte)}</p>` : ""}
          ${(p.valeurs || []).length ? `<ul class="items">${p.valeurs.map((v) => `<li><strong>${esc(v.nom)}</strong><span>${esc(v.texte)}</span></li>`).join("")}</ul>` : ""}
        </div>
        ${ideas.map((d, k) => `<div class="card" style="--c: var(--s7)"><h3>${ideas.length > 1 ? `Idée à surveiller ${k + 1}/${ideas.length}` : "Idée à surveiller"}</h3>
          <div class="idea-head"><span class="nm">${esc(d.nom)}</span>${d.prix ? `<span style="font-family:var(--font-data);color:var(--fg-2)">${esc(d.prix)}</span>` : ""}</div>
          <div class="chips">${d.risque ? `<span class="chip"><span class="sw" style="background:var(${RISK[d.risque] || "--r3"})"></span>Risque ${esc(String(d.risque).toLowerCase())}</span>` : ""}${d.isin ? `<span class="chip">${esc(d.isin)}</span>` : ""}</div>
          <p>${esc(d.texte)}</p></div>`).join("")}
        ${p.concept ? `<div class="card" style="--c: var(--s4)"><h3>Le concept du jour</h3><span class="term">${esc(p.concept.terme)}</span><p>${esc(p.concept.texte)}</p></div>` : ""}
        ${(p.rendezvous || []).length ? `<div class="card full" style="--c: var(--s2)"><h3>Les prochains rendez-vous</h3><ul class="mini-list">${p.rendezvous.map((r) => `<li><span class="dt">${fmt(r.date, { day: "numeric", month: "short" })}</span>${esc(r.titre)}</li>`).join("")}</ul></div>` : ""}
        ${(p.sources || []).length ? `<div class="card full" style="--c: var(--muted)"><h3>Sources</h3><ul class="src">${p.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.titre)}</a></li>`).join("")}</ul></div>` : ""}
      </div>`;
  }

  $("days").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; idx = Number(b.dataset.i); render(); window.scrollTo({ top: 0, behavior: "smooth" }); });

  fetch("data/points.json?t=" + Date.now(), { cache: "no-store" }).then((r) => r.json()).then((d) => {
    points = [...(d.points || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
    $("dot").className = "dot " + (points.length ? "live" : "");
    $("stat").textContent = points.length ? "Dernier point : " + fmt(points[0].date, { day: "numeric", month: "long" }) : "Premier point ce soir vers 21h";
    render();
  }).catch(() => { $("dot").className = "dot stale"; $("stat").textContent = "Point introuvable, recharge la page"; render(); });
})();
</script>
</body>
</html>
