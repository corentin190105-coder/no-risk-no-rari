name: Cours
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 7-17 * * 1-5"
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Récupère les cours
        run: python3 scripts/cours.py
      - name: Publie le fichier
        run: |
          git add data/cours.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cours du $(TZ=Europe/Paris date +%F\ %H:%M)"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
